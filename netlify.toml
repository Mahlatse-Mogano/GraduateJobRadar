# On every push (and every morning via a build hook) Netlify fetches the open listings
# from Supabase once and publishes them with the page as public/listings.json.
[build]
  publish = "public"
  command = "node scripts/build-listings.mjs"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Always fetch the latest page so changes show as soon as a deploy finishes
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Listings file: browsers re-check it cheaply (ETag), Netlify's cache serves it
[[headers]]
  for = "/listings.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"
